<!doctype html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="utf-8">
  <title>الذهب العُماني</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme / language before the first paint (avoids a flash). Dark is the default.
    (function () {
      try {
        var root = document.documentElement;
        if (localStorage.getItem('theme') === 'light') root.classList.remove('dark');
        if (localStorage.getItem('lang') === 'en') { root.lang = 'en'; root.dir = 'ltr'; }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>
</html>
