@switch (name()) {
  @case ('sparkle') {
    <svg viewBox="0 0 24 24" fill="currentColor" class="size-full">
      <path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10Z" />
    </svg>
  }
  @case ('calculator') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="size-full">
      <rect x="5" y="2.5" width="14" height="19" rx="3" />
      <rect x="8" y="6" width="8" height="3.5" rx="1" />
      <path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01" stroke-width="2" />
    </svg>
  }
  @case ('arrow-up') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-full">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  }
  @case ('arrow-up-right') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-full">
      <path d="M7 17 17 7M8 7h9v9" />
    </svg>
  }
  @case ('arrow-down-right') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-full">
      <path d="M7 7l10 10M17 8v9H8" />
    </svg>
  }
  @case ('chevron-down') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-full">
      <path d="m6 9 6 6 6-6" />
    </svg>
  }
}
