<div class="glow-card flex h-full min-h-52 flex-col rounded-3xl border border-line bg-card p-6">

  <p class="text-4xl font-light text-ink">{{ karat() }}</p>

  <h3 class="mt-3 text-sm font-semibold text-ink">{{ i18n.t('goldKarat') }}</h3>
  <p class="mt-1 text-xs text-muted">{{ i18n.t('currentPrice') }}</p>

  <div class="mt-auto flex items-end justify-between gap-3 pt-6">
    @if (loading()) {
      <app-skeleton class="h-9 w-36" />
    } @else {
      <p class="motion-safe:animate-fade-in-up">
        <span class="text-3xl font-light text-ink">{{ price() | number: '1.3-3' }}</span>
        <span class="ms-1 text-xs text-muted">{{ i18n.t('priceUnit') }}</span>
      </p>
    }

    <app-icon name="sparkle" class="size-5 text-muted" />
  </div>

</div>
