<header class="sticky top-0 z-50 border-b border-line bg-page/80 backdrop-blur-xl">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">

      <!-- Logo & Site Name -->
      <a href="#" [attr.aria-label]="i18n.t('homeLink')">
        <app-brand />
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden items-center gap-1 md:flex" [attr.aria-label]="i18n.t('mainNav')">
        @for (link of navLinks; track link.sectionId) {
          <a
            [href]="'#' + link.sectionId"
            (click)="selectSection(link.sectionId)"
            [attr.aria-current]="activeSection() === link.sectionId ? 'location' : null"
            class="rounded-full px-4 py-2 text-sm transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/60"
            [class]="
              activeSection() === link.sectionId
                ? 'bg-accent/25 font-medium text-accent'
                : 'text-muted hover:bg-accent/10 hover:text-accent'
            "
          >
            {{ i18n.t(link.labelKey) }}
          </a>
        }
      </nav>

      <div class="flex items-center gap-2">
        <!-- Demo Badge -->
        <span class="hidden items-center rounded-full border border-line px-3 py-1.5 text-xs text-muted lg:inline-flex">
          {{ i18n.t('demoData') }}
        </span>

        <app-language-toggle />
        <app-theme-toggle />

        <!-- Mobile Menu Button -->
        <button
          type="button"
          class="inline-flex size-9 items-center justify-center rounded-full border border-line text-muted transition hover:border-accent hover:text-ink md:hidden"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="isMenuOpen()"
          [attr.aria-label]="i18n.t('menu')"
          (click)="toggleMenu()"
        >
          <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            @if (isMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
            }
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Navigation -->
  @if (isMenuOpen()) {
    <nav id="mobile-menu" class="border-t border-line bg-page md:hidden" [attr.aria-label]="i18n.t('mainNav')">
      <div class="mx-auto flex max-w-7xl flex-col px-4 py-3">
        @for (link of navLinks; track link.sectionId) {
          <a
            [href]="'#' + link.sectionId"
            (click)="selectSection(link.sectionId)"
            [attr.aria-current]="activeSection() === link.sectionId ? 'location' : null"
            class="rounded-xl px-3 py-3 text-sm transition-colors"
            [class]="
              activeSection() === link.sectionId
                ? 'bg-accent/25 font-medium text-accent'
                : 'text-muted hover:bg-accent/10 hover:text-accent'
            "
          >
            {{ i18n.t(link.labelKey) }}
          </a>
        }
        <span class="mt-2 self-start rounded-full border border-line px-3 py-1.5 text-xs text-muted">
          {{ i18n.t('demoData') }}
        </span>
      </div>
    </nav>
  }
</header>
